name: Deploy

on:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd ~/gener-bot
            git fetch origin main
            git reset --hard origin/main
            npm ci
            rm -rf built
            npm run build
            npm prune --omit=dev
            before=$(systemctl show gener-bot -p NRestarts --value)
            sudo systemctl restart gener-bot
            sleep 15
            # Restart=always masks crash loops from a bare is-active; fail if systemd auto-restarted it since
            sudo systemctl is-active gener-bot
            test "$(systemctl show gener-bot -p NRestarts --value)" = "$before" || { journalctl -u gener-bot -n 30 --no-pager; exit 1; }
